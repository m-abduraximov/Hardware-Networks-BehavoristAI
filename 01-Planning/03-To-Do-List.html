
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Progress table</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #253047;
            margin: 0;
            padding: 35px 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .add-form input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d6dce5;
            border-radius: 8px;
            font-size: 15px;
        }

        .add-form button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            background: #2563eb;
            color: white;
        }

        .table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e8edf3;
            text-align: center;
        }

        th {
            background: #edf2f8;
            font-size: 14px;
        }

        th:first-child,
        td:first-child {
            text-align: left;
            width: 40%;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .task-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .delete-button {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
        }

        .delete-button:hover {
            color: #dc2626;
        }

        .status-choice {
            width: 100%;
            min-height: 44px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            color: #94a3b8;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        .status-choice:hover {
            background: #f1f5f9;
        }

        .status-todo.selected {
            background: #fff3cd;
            border-color: #e9bd45;
            color: #946200;
        }

        .status-progress.selected {
            background: #dbeafe;
            border-color: #60a5fa;
            color: #1d4ed8;
        }

        .status-done.selected {
            background: #dcfce7;
            border-color: #86d6a0;
            color: #166534;
        }

        @media (max-width: 500px) {
            body {
                padding: 20px 10px;
            }

            .add-form button {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <h1>Progress table</h1>

        <form class="add-form" id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                maxlength="120"
                required
            >

            <button type="submit">+ Add task</button>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Task</th>
                        <th>To-do</th>
                        <th>In progress</th>
                        <th>Done</th>
                    </tr>
                </thead>

                <tbody id="taskRows"></tbody>
            </table>
        </div>

    </main>

    <script>
        const STORAGE_KEY =
            "progress-tracker:" + window.location.pathname;

        const defaultTasks = [
            { id: "1", name: "README file", status: "todo" },
            { id: "2", name: "Rough Plan", status: "progress" },
            { id: "3", name: "To-do-list", status: "done" }
        ];

        const statuses = ["todo", "progress", "done"];

        function loadTasks() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);

                if (saved !== null) {
                    const parsed = JSON.parse(saved);

                    if (
                        Array.isArray(parsed) &&
                        parsed.every(task =>
                            task &&
                            typeof task.id === "string" &&
                            typeof task.name === "string" &&
                            statuses.includes(task.status)
                        )
                    ) {
                        return parsed;
                    }
                }
            } catch (error) {
                console.error("Could not load saved tasks:", error);
            }

            return defaultTasks.map(task => ({ ...task }));
        }

        let tasks = loadTasks();

        function saveTasks() {
            try {
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(tasks)
                );
            } catch (error) {
                console.error("Could not save tasks:", error);
                alert("The browser could not save your changes.");
            }
        }

        function renderTasks() {
            const tbody = document.getElementById("taskRows");
            tbody.replaceChildren();

            tasks.forEach(task => {
                const row = document.createElement("tr");

                const taskCell = document.createElement("td");
                const taskContent = document.createElement("div");
                taskContent.className = "task-content";

                const taskName = document.createElement("span");
                taskName.textContent = task.name;

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-button";
                deleteButton.textContent = "×";
                deleteButton.title = "Delete task";
                deleteButton.setAttribute(
                    "aria-label",
                    "Delete " + task.name
                );

                deleteButton.addEventListener("click", () => {
                    if (confirm("Delete this task?")) {
                        tasks = tasks.filter(
                            item => item.id !== task.id
                        );

                        saveTasks();
                        renderTasks();
                    }
                });

                taskContent.append(taskName, deleteButton);
                taskCell.appendChild(taskContent);
                row.appendChild(taskCell);

                const labels = {
                    todo: "To-do",
                    progress: "In progress",
                    done: "Done"
                };

                statuses.forEach(status => {
                    const cell = document.createElement("td");
                    const button = document.createElement("button");

                    const isSelected = task.status === status;

                    button.type = "button";
                    button.className =
                        "status-choice status-" + status;

                    if (isSelected) {
                        button.classList.add("selected");
                    }

                    button.textContent = isSelected ? "✓" : "○";
                    button.title = "Set status: " + labels[status];

                    button.setAttribute(
                        "aria-label",
                        "Set " + task.name + " to " + labels[status]
                    );

                    button.setAttribute(
                        "aria-pressed",
                        String(isSelected)
                    );

                    button.addEventListener("click", () => {
                        task.status = status;
                        saveTasks();
                        renderTasks();
                    });

                    cell.appendChild(button);
                    row.appendChild(cell);
                });

                tbody.appendChild(row);
            });

            if (tasks.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 4;
                cell.textContent =
                    "No tasks yet. Add your first task above.";
                cell.style.textAlign = "center";

                row.appendChild(cell);
                tbody.appendChild(row);
            }
        }

        document.getElementById("taskForm")
            .addEventListener("submit", event => {
                event.preventDefault();

                const input = document.getElementById("taskInput");
                const name = input.value.trim();

                if (name === "") {
                    return;
                }

                tasks.push({
                    id: Date.now().toString() +
                        Math.random().toString(16).slice(2),
                    name: name,
                    status: "todo"
                });

                saveTasks();
                renderTasks();

                input.value = "";
                input.focus();
            });

        renderTasks();
    </script>
</body>
</html>
